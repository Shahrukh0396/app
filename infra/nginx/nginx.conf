upstream scanflow_api {
  server api:3000;
}

upstream scanflow_admin {
  server admin:3001;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 30m;

  location /api/ {
    proxy_pass http://scanflow_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://scanflow_api/health;
  }

  location = /ready {
    proxy_pass http://scanflow_api/ready;
  }

  location / {
    proxy_pass http://scanflow_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
