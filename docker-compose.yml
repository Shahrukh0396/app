services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanflow
      POSTGRES_PASSWORD: scanflow
      POSTGRES_DB: scanflow
    volumes:
      - scanflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanflow -d scanflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - scanflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://scanflow:scanflow@postgres:5432/scanflow?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  scanflow_postgres:
  scanflow_redis:
